services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hub_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - hub_network

  web:
    image: nginx:alpine
    container_name: hub_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - hub_network
    depends_on:
      - app

networks:
  hub_network:
    driver: bridge